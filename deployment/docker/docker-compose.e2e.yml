services:
  training-platform-e2e:
    image: mcr.microsoft.com/playwright:v1.55.0-noble
    working_dir: /workspace/e2e
    network_mode: host
    environment:
      BASE_URL: ${BASE_URL:-http://127.0.0.1:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-phase2-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Phase2Admin!2026}
      TEST_COURSE_SLUG: ${TEST_COURSE_SLUG:-enterprise-network-automation-sdwan}
    volumes:
      - ../../e2e:/workspace/e2e
    command: bash -lc "npm install --no-audit --no-fund && npx playwright test"
